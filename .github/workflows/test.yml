name: Automated Test Suite

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    name: Run Unit & E2E Suites
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Execute API Unit Tests
        run: |
          cd apps/api
          pip install -r requirements.txt pytest
          rm -f ci_test.db test.db
          python -m pytest -o pythonpath=. tests/

      - name: Build Next.js Web
        run: |
          cd apps/web
          npm install
          npx next build
