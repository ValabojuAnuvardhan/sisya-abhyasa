name: Code Quality & Linting

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  lint:
    name: Code Quality & Lint Verification
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Next.js Web Typecheck
        run: |
          cd apps/web
          npm install
          npx next build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Flake8 & Verify Python Quality
        run: |
          pip install flake8
          flake8 apps/api/app --count --select=E9,F63,F7,F82 --show-source --statistics
