name: Code Quality & Linting

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  lint:
    name: ESLint & Flake8 Verification
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'apps/web/package-lock.json'

      - name: Install Web Dependencies & Lint
        run: |
          cd apps/web
          npm ci
          npm run lint

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'apps/api/requirements.txt'

      - name: Install Flake8 & Verify Python Quality
        run: |
          pip install flake8
          flake8 apps/api/app --count --select=E9,F63,F7,F82 --show-source --statistics
